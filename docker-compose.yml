version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: critiquelens-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: ./backend
    container_name: critiquelens-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - META_MODEL_API_KEY=${META_MODEL_API_KEY}
      - NODE_ENV=production
    depends_on:
      - redis
    restart: always
